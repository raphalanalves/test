<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="logo.js"></script>
<style>
body{width:1080px;height:1920px;margin:0;overflow:hidden;background:#000;font-family:Inter,system-ui,sans-serif}
#cam{position:absolute;inset:-40px;transform-origin:50% 50%}
#wall{position:absolute;inset:0;background:radial-gradient(circle at 25% 20%,#2c4a5a 0,transparent 45%),radial-gradient(circle at 80% 70%,#3b2f5c 0,transparent 50%),radial-gradient(circle at 60% 30%,#1d2b3a 0,transparent 60%),#0b0e14;filter:blur(2px)}
#clock{position:absolute;left:0;right:0;top:420px;text-align:center;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.3)}
#clock .d{font-size:40px;font-weight:600;opacity:.9}
#clock .h{font-size:250px;font-weight:700;letter-spacing:-6px;line-height:1;margin-top:4px}
#stack{position:absolute;left:70px;right:70px;top:900px;display:flex;flex-direction:column;gap:16px}
.n{display:flex;gap:22px;align-items:center;padding:26px 28px;border-radius:44px;background:rgba(40,44,56,.62);backdrop-filter:blur(30px);color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.n .ic{width:76px;height:76px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;font-size:40px}
.n .t{flex:1;min-width:0}.n b{display:flex;justify-content:space-between;font-size:30px}.n b em{font-style:normal;font-weight:400;font-size:24px;opacity:.6}
.n p{margin:4px 0 0;font-size:30px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#more{align-self:center;padding:14px 30px;border-radius:30px;background:rgba(40,44,56,.62);color:#fff;font-size:28px;font-weight:600}
#cap{position:absolute;left:90px;right:90px;top:120px;text-align:center;z-index:5}
#cap span{display:inline;background:#fff;color:#111;font-weight:700;font-size:52px;line-height:1.45;padding:6px 18px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#grain{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.10}
#glare{position:absolute;inset:0;z-index:7;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%)}
#vig{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55))}
#fim{position:absolute;inset:0;z-index:6;background:#05050A;display:none;color:#fff;text-align:center}
#fim .q{position:absolute;left:60px;right:60px;top:560px;font-weight:800;font-size:96px;line-height:1.05;letter-spacing:-2px}
#fim .d{position:absolute;left:0;right:0;top:900px;font-family:'Bebas Neue';font-size:220px;letter-spacing:6px}
#prof{position:absolute;left:50%;top:1250px;transform:translateX(-50%);display:flex;align-items:center;gap:22px;background:#14151f;border:2px solid #2a2c3e;border-radius:28px;padding:22px 26px}
#prof .av{width:96px;height:96px;border-radius:50%;background:#0E0E16;border:3px solid #00D4AA;display:flex;align-items:center;justify-content:center}#prof .av svg{width:70px;height:70px}
#prof .u{font-size:32px;font-weight:700;text-align:left}#prof .u small{display:block;font-size:24px;font-weight:400;color:#A9ADB3}
#seg{padding:16px 34px;border-radius:14px;background:#0095F6;font-size:30px;font-weight:700}
#seg.ok{background:#2a2c3e}
#dedo{position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.8);z-index:9;display:none}
</style></head><body>
<div id="cam"><div id="wall"></div>
 <div id="clock"><div class="d">quarta-feira, 28 de outubro</div><div class="h">7:02</div></div>
 <div id="stack"></div>
</div>
<div id="cap"><span id="capt"></span></div>
<div id="fim"><div class="q" id="fq">Quem respondeu<br>tudo isso?</div><div class="d"><span class="grad">10.11</span></div>
 <div id="prof"><div class="av" id="pav"></div><div class="u">malvora_hub<small>A nova alquimia digital</small></div><div id="seg">Seguir</div></div></div>
<div id="dedo"></div>
<canvas id="grain" width="540" height="960"></canvas><div id="glare"></div><div id="vig"></div>
<script>
const clamp=x=>Math.min(Math.max(x,0),1),ease=x=>1-Math.pow(1-clamp(x),3),back=x=>{x=clamp(x);const k=1.6;return 1+(k+1)*Math.pow(x-1,3)+k*Math.pow(x-1,2)},rnd=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const $=i=>document.getElementById(i);$('pav').innerHTML=logoSVG(4);
const WA='#25D366',AG='#FF3B30',PX='#00B37E',WAI='💬',AGI='📅',PXI='💸';
const N=[[WA,WAI,'WhatsApp','23:47','Paula: perfeito, quinta 15h então! 🙏'],[AG,AGI,'Agenda','23:48','Novo horário · Paula · qui 15h'],
 [WA,WAI,'WhatsApp','00:13','Lucas: valeu pela resposta rápida!'],[PX,PXI,'Pix recebido','00:14','R$ 120,00 · Lucas Andrade'],
 [AG,AGI,'Agenda','01:02','Remarcado · João · sex 9h'],[WA,WAI,'WhatsApp','05:58','Carla: vocês abrem sábado? Já marquei aqui 😍']];
$('stack').innerHTML=N.map((n,i)=>`<div class="n" id="n${i}"><div class="ic" style="background:${n[0]}">${n[1]}</div><div class="t"><b>${n[2]}<em>${n[3]}</em></b><p>${n[4]}</p></div></div>`).join('')+'<div id="more">+43 notificações</div>';
const g=$('grain').getContext('2d'),img=g.createImageData(540,960);
const CAP=[[0.3,4.6,'POV: abri o WhatsApp da minha empresa às 7h da manhã'],[4.6,8.4,'eu tava dormindo. ninguém da equipe tava online.'],[8.4,11.0,'então quem respondeu? 👀']];
window.render=function(t){
 // câmera na mão
 const w=Math.sin(t*1.7)*6+Math.sin(t*3.1)*3,z=1.02+0.015*Math.sin(t*.8)+(t<11?0.03*clamp(t/11):0);
 $('cam').style.transform=`translate(${w}px,${Math.cos(t*1.3)*7}px) rotate(${Math.sin(t*.9)*.6}deg) scale(${z})`;
 // notificações descendo uma a uma (mais recente em cima)
 N.forEach((_,i)=>{const a=1.5+i*1.1,e=$('n'+i);e.style.display=t>=a?'':'none';if(t>=a){const k=back((t-a)/0.35);e.style.transform=`translateY(${(1-k)*-60}px) scale(${0.9+0.1*k})`;e.style.opacity=clamp((t-a)*6);}});
 $('stack').style.flexDirection='column-reverse';
 const m=$('more');m.style.display=t>=8.0?'':'none';if(t>=8)m.style.transform=`scale(${back((t-8)/0.3)})`;
 // legenda estilo Reels
 let c=null;for(const x of CAP) if(t>=x[0]&&t<x[1]) c=x;
 $('cap').style.display=c&&t<11?'':'none';if(c){$('capt').textContent=c[2];$('cap').style.transform=`scale(${0.92+0.08*ease((t-c[0])/0.2)})`;}
 // fim: pergunta + seguir
 const f=t>=11.0;$('fim').style.display=f?'block':'none';
 if(f){$('fim').style.opacity=ease((t-11)/0.3);$('fq').style.transform=`scale(${0.85+0.15*back((t-11)/0.4)})`;
  const d=$('dedo');const tap=14.0;d.style.display=t>=13.2&&t<14.8?'block':'none';
  const sx=760,sy=1300;d.style.left=(sx+60*(1-ease((t-13.2)/0.7)))+'px';d.style.top=(sy+200*(1-ease((t-13.2)/0.7)))+'px';d.style.transform=`scale(${t>=tap&&t<tap+0.15?0.8:1})`;
  const s=$('seg');if(t>=tap){s.textContent='Seguindo';s.className='ok';}else{s.textContent='Seguir';s.className='';}}
 // grão de filme
 for(let i=0;i<img.data.length;i+=4){const v=rnd(i*.37+Math.floor(t*30)*13.1)*255;img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255;}g.putImageData(img,0,0);
 $('glare').style.backgroundPosition=`${Math.sin(t*.7)*120}px 0`;
};
</script></body></html>
