<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
html,body{width:1080px;height:1920px;overflow:hidden}
#st{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.c{position:absolute;left:0;right:0;text-align:center;padding:0 70px}
.hook{top:560px;font-size:168px}
.tag{font:600 30px/1 Inter;letter-spacing:8px;color:var(--g);text-transform:uppercase}
.feat{position:absolute;left:110px;right:90px;display:flex;align-items:center;gap:34px;font:800 64px/1.1 Inter;letter-spacing:-1px}
.feat i{flex:none;width:92px;height:92px;border-radius:26px;display:grid;place-items:center;background:rgba(0,212,170,.14);border:2px solid rgba(0,212,170,.5);color:var(--g);font-style:normal;font-size:52px}
.seg{top:780px;font-size:230px}
.num{top:640px;font:600 34px/1 'DM Mono',monospace;letter-spacing:6px;color:var(--mut)}
.fast{font-size:150px}
.big{font-size:150px}
.logo-end{position:absolute;left:50%;transform:translateX(-50%);height:190px}
.pill{display:inline-block;padding:26px 46px;border-radius:999px;background:var(--g);color:#06231D;font:800 52px/1 Inter}
.bar{position:absolute;left:0;bottom:0;height:10px;background:linear-gradient(90deg,var(--t1),var(--t2))}
</style></head><body><div id="st"></div>
<script>
const st=document.getElementById('st');
const E=(t,a,b,d=0.18)=>Math.max(0,Math.min(1,(t-a)/d))*Math.max(0,Math.min(1,(b-t)/d));      // entra e sai
const pop=(t,a)=>{const x=Math.max(0,Math.min(1,(t-a)/0.16));return 0.7+0.3*(1-Math.pow(1-x,3))};
const P1=[["Clínica",9.28],["Salão",10.06],["Barbearia",10.9],["Loja de carros",11.86]];
const P2=[["Odontologia",13.2],["Fisioterapia",13.84],["Psicologia",14.43],["Estética",15.01],["Manicure",15.5],["Tatuagem",15.95],["Pet shop",16.46],["Academia",16.89],["Oficina",17.24],["Autoescola",17.59],["Advocacia",18.06],["Contabilidade",18.49],["Imobiliária",18.93],["Ótica",19.33]];
const T=34.78;
function render(t){
 let h=`<div class="glow" style="left:${-200+60*Math.sin(t/3)}px;top:${-260+40*Math.cos(t/4)}px"></div><div class="tex"></div>`;
 // 1. gancho (visível no quadro 0)
 let o=t<2.9?1:E(t,-1,3.1);
 if(o>0) h+=`<div class="c hook h" style="opacity:${o}">AFINAL,<br>O QUE A<br><span class="grad">MALVORA</span><br>FAZ?</div>`;
 // 2. o que faz
 const F=[["✓","Responde o WhatsApp na hora",3.38],["✓","Marca na agenda",5.96],["✓","Lembra o cliente",7.2]];
 F.forEach((f,i)=>{const a=E(t,f[2],8.45);if(a>0)h+=`<div class="feat" style="top:${640+i*190}px;opacity:${a};transform:translateY(${(1-Math.min(1,(t-f[2])/0.2))*30}px)"><i>${f[0]}</i>${f[1]}</div>`});
 if(E(t,3.2,8.45)>0) h+=`<div class="c tag" style="top:500px;opacity:${E(t,3.2,8.45)}">A Malvora</div>`;
 // 3. pra quem
 if(t>=8.48&&t<9.28) h+=`<div class="c big h" style="top:800px">PRA <span class="grad">QUEM?</span></div>`;
 // 4. segmentos com calma
 P1.forEach((s,i)=>{const fim=i<3?P1[i+1][1]:13.2;if(t>=s[1]&&t<fim){h+=`<div class="c num" style="top:700px">${String(i+1).padStart(2,'0')} / 30+</div><div class="c seg h" style="top:${s[0].length>10?820:780}px;font-size:${s[0].length>10?170:230}px;transform:scale(${pop(t,s[1])})">${s[0]}</div>`}});
 // 5. segmentos rápidos
 P2.forEach((s,i)=>{const fim=i<P2.length-1?P2[i+1][1]:19.98;if(t>=s[1]&&t<fim){const k=i+5;h+=`<div class="c num" style="top:700px">${String(k).padStart(2,'0')} / 30+</div><div class="c fast h ${i%2?'verde':''}" style="top:820px;transform:scale(${pop(t,s[1])}) rotate(${(i%2?1:-1)*1.5}deg)">${s[0]}</div>`}});
 // 6. respiração e "e até o seu negócio"
 if(t>=19.98&&t<21.24) h+=`<div class="c big h" style="top:860px;opacity:.5">…</div>`;
 if(t>=21.24&&t<23.42) h+=`<div class="c big h" style="top:700px;transform:scale(${pop(t,21.24)})">…E ATÉ<br>O <span class="grad">SEU</span><br>NEGÓCIO</div>`;
 if(t>=23.42&&t<26.0) h+=`<div class="c h" style="top:620px;font-size:330px;transform:scale(${pop(t,23.42)})"><span class="grad">+30</span></div><div class="c h" style="top:980px;font-size:110px">TIPOS DE NEGÓCIO</div>`;
 if(t>=26.0&&t<27.44) h+=`<div class="c big h" style="top:760px;transform:scale(${pop(t,26)})">O SEU NÃO<br>ESTÁ NA <span class="verde">LISTA?</span></div>`;
 if(t>=27.44&&t<30.42) h+=`<div class="c tag" style="top:640px">No portal</div><div class="c big h" style="top:720px;transform:scale(${pop(t,27.44)})">VOCÊ AJUSTA<br>DO <span class="grad">SEU JEITO</span></div>`;
 // 7. final
 if(t>=30.42){const a=Math.min(1,(t-30.42)/0.25);h+=`<img class="logo-end sym-img" src="simbolo-principal.png" style="top:470px;opacity:${a}"><div class="c h" style="top:740px;font-size:130px;opacity:${a}">TESTE <span class="grad">GRÁTIS</span><br>SEM CARTÃO</div><div class="c" style="top:1120px;opacity:${Math.min(1,Math.max(0,(t-32.3)/0.2))}"><span class="pill">Link na bio ↗</span></div><div class="c tag" style="top:1420px;opacity:${a};color:#fff;letter-spacing:12px">Malvora Hub</div>`}
 h+=`<div class="bar" style="width:${t/T*100}%"></div>`;
 st.innerHTML=h;
}
render(0);
</script></body></html>
