<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
html,body{width:1080px;height:1920px;overflow:hidden}
#st{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.c{position:absolute;left:0;right:0;text-align:center;padding:0 70px}
.hook{top:560px;font-size:168px}
.tag{font:600 30px/1 Inter;letter-spacing:8px;color:var(--g);text-transform:uppercase}
.feat{position:absolute;left:100px;right:80px;display:flex;align-items:center;gap:30px;font:800 58px/1.1 Inter;letter-spacing:-1px}
.ff{position:absolute;top:300px;right:80px;padding:14px 26px;border-radius:14px;background:rgba(123,104,238,.2);border:2px solid var(--roxo);color:#fff;font:700 40px/1 'DM Mono',monospace;letter-spacing:4px}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px);pointer-events:none}
.feat i{flex:none;width:84px;height:84px;border-radius:26px;display:grid;place-items:center;background:rgba(0,212,170,.14);border:2px solid rgba(0,212,170,.5);color:var(--g);font-style:normal;font-size:52px}
.seg{top:780px;font-size:230px}
.num{top:640px;font:600 34px/1 'DM Mono',monospace;letter-spacing:6px;color:var(--mut)}
.fast{font-size:150px}
.big{font-size:150px}
.logo-end{position:absolute;left:50%;transform:translateX(-50%);height:190px}
.pill{display:inline-block;padding:26px 46px;border-radius:999px;background:var(--g);color:#06231D;font:800 52px/1 Inter}
.bar{position:absolute;left:0;bottom:0;height:10px;background:linear-gradient(90deg,var(--t1),var(--t2))}
</style></head><body><div id="st"></div>
<script>
const st=document.getElementById('st');
const E=(t,a,b,d=0.18)=>Math.max(0,Math.min(1,(t-a)/d))*Math.max(0,Math.min(1,(b-t)/d));      // entra e sai
const pop=(t,a)=>{const x=Math.max(0,Math.min(1,(t-a)/0.16));return 0.7+0.3*(1-Math.pow(1-x,3))};
const P1=[["Clínica",13.24],["Salão",13.96],["Barbearia",14.74],["Loja de carros",15.62]];
const P2=[["Odontologia",17.0],["Fisioterapia",17.64],["Psicologia",18.23],["Estética",18.81],["Manicure",19.3],["Tatuagem",19.75],["Pet shop",20.26],["Academia",20.69],["Oficina",21.04],["Autoescola",21.39],["Advocacia",21.86],["Contabilidade",22.29],["Imobiliária",22.73],["Ótica",23.13]];
const T=38.6;
function render(t){
 let h=`<div class="glow" style="left:${-200+60*Math.sin(t/3)}px;top:${-260+40*Math.cos(t/4)}px"></div><div class="tex"></div>`;
 // 1. gancho (visível no quadro 0)
 let o=t<2.9?1:E(t,-1,3.1);
 if(o>0) h+=`<div class="c hook h" style="opacity:${o}">AFINAL,<br>O QUE A<br><span class="grad">MALVORA</span><br>FAZ?</div>`;
 // 2. o que faz
 const F=[["✓","Responde o WhatsApp na hora",3.32],["✓","Marca na agenda",5.86],["✓","Lembra o cliente",7.1],["✓","Cobra pelo WhatsApp",8.2],["✓","Traz de volta quem sumiu",8.86],["✓","Manda os relatórios",10.9]];
 F.forEach((f,i)=>{const a=E(t,f[2],12.3);if(a>0)h+=`<div class="feat" style="top:${560+i*165}px;opacity:${a};transform:translateY(${(1-Math.min(1,(t-f[2])/0.2))*30}px)"><i>${f[0]}</i>${f[1]}</div>`});
 if(E(t,3.2,12.3)>0) h+=`<div class="c tag" style="top:440px;opacity:${E(t,3.2,12.3)}">A Malvora</div>`;
 // 3. pra quem
 if(t>=12.36&&t<13.24) h+=`<div class="c big h" style="top:800px">PRA <span class="grad">QUEM?</span></div>`;
 // 4. segmentos com calma
 P1.forEach((s,i)=>{const fim=i<3?P1[i+1][1]:17.0;if(t>=s[1]&&t<fim){h+=`<div class="c num" style="top:700px">${String(i+1).padStart(2,'0')} / 30+</div><div class="c seg h" style="top:${s[0].length>10?820:780}px;font-size:${s[0].length>10?170:230}px;transform:scale(${pop(t,s[1])})">${s[0]}</div>`}});
 // 5. segmentos rápidos
 P2.forEach((s,i)=>{const fim=i<P2.length-1?P2[i+1][1]:23.78;if(t>=s[1]&&t<fim){const k=i+5;h+=`<div class="ff">▶▶ ${t<20.66?"1.6X":"2X"}</div><div class="scan"></div><div class="c num" style="top:700px">${String(k).padStart(2,'0')} / 30+</div><div class="c fast h ${i%2?'verde':''}" style="top:820px;transform:scale(${pop(t,s[1])}) rotate(${(i%2?1:-1)*1.5}deg)">${s[0]}</div>`}});
 // 6. respiração e "e até o seu negócio"
 if(t>=23.78&&t<25.04) h+=`<div class="c big h" style="top:860px;opacity:.5">…</div>`;
 if(t>=25.04&&t<27.22) h+=`<div class="c big h" style="top:700px;transform:scale(${pop(t,25.04)})">…E ATÉ<br>O <span class="grad">SEU</span><br>NEGÓCIO</div>`;
 if(t>=27.22&&t<29.8) h+=`<div class="c h" style="top:620px;font-size:330px;transform:scale(${pop(t,27.22)})"><span class="grad">+30</span></div><div class="c h" style="top:980px;font-size:110px">TIPOS DE NEGÓCIO</div>`;
 if(t>=29.8&&t<31.24) h+=`<div class="c big h" style="top:760px;transform:scale(${pop(t,29.8)})">O SEU NÃO<br>ESTÁ NA <span class="verde">LISTA?</span></div>`;
 if(t>=31.24&&t<34.22) h+=`<div class="c tag" style="top:640px">No portal</div><div class="c big h" style="top:720px;transform:scale(${pop(t,31.24)})">VOCÊ AJUSTA<br>DO <span class="grad">SEU JEITO</span></div>`;
 // 7. final
 if(t>=34.22){const a=Math.min(1,(t-34.22)/0.25);h+=`<img class="logo-end sym-img" src="simbolo-principal.png" style="top:470px;opacity:${a}"><div class="c h" style="top:740px;font-size:130px;opacity:${a}">TESTE <span class="grad">GRÁTIS</span><br>SEM CARTÃO</div><div class="c" style="top:1120px;opacity:${Math.min(1,Math.max(0,(t-36.1)/0.2))}"><span class="pill">Link na bio ↗</span></div><div class="c tag" style="top:1420px;opacity:${a};color:#fff;letter-spacing:12px">Malvora Hub</div>`}
 h+=`<div class="bar" style="width:${t/T*100}%"></div>`;
 st.innerHTML=h;
}
render(0);
</script></body></html>
