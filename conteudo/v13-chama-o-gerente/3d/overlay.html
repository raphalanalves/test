<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;700&display=block">
<style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:Inter,sans-serif}
.el{position:absolute;opacity:0}
.topo{left:60px;right:60px;top:150px;text-align:center;font-family:'Bebas Neue';color:#fff;line-height:.95;text-shadow:0 6px 30px rgba(0,0,0,.65)}
.grad{background:linear-gradient(90deg,#00D4AA,#7B68EE);-webkit-background-clip:text;background-clip:text;color:transparent}
.bal{background:#1C1D29;color:#E9EAEE;font-size:34px;padding:16px 24px;border-radius:24px;border-top-left-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);white-space:nowrap}
.cont{left:600px;top:1330px;background:#E5484D;color:#fff;font-family:'Bebas Neue';font-size:96px;line-height:1;padding:10px 30px;border-radius:60px;box-shadow:0 0 40px rgba(229,72,77,.6)}
.ia{background:#0B3A33;color:#E8FFF8;font-size:32px;padding:16px 24px;border-radius:24px;border-top-right-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:620px}
.fim{inset:0;background:rgba(10,10,16,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
.lab{font-family:'Bebas Neue';letter-spacing:8px;color:#A9ADB3;font-size:44px}
</style></head><body>
<div class="el topo" id="h1" style="font-size:96px">O DONO NO<br><span class="grad">40º "QUANTO CUSTA?"</span><br>DO DIA:</div>
<div class="el cont" id="cont">12</div>
<div class="el topo" id="h2" style="font-size:110px;top:170px">"QUANTO CUSTA?"<br><span class="grad">Nº 40</span></div>
<div class="el topo" id="h3" style="font-size:100px;top:150px">COM A <span class="grad">MALVORA:</span></div>
<div class="el topo" id="h4" style="font-size:84px;top:280px">A IA RESPONDE.<br>VOCÊ DESCANSA.</div>
<div class="el ia" id="ia" style="right:60px;top:1210px">Oi! Já te passo os valores e os horários livres de amanhã 😊</div>
<div class="el fim" id="fim">
 <img src="simbolo-principal.png" style="width:300px">
 <div style="font-family:'Bebas Neue';font-size:120px;color:#fff;text-align:center;line-height:.95">LISTA VIP<br><span class="grad">NO LINK DA BIO</span></div>
 <div class="lab">MALVORA · ABRE 10.11 · 00H</div>
</div>
<img class="el" id="wm" src="simbolo-principal.png" style="right:56px;top:84px;width:84px">
<div id="bals"></div>
<script>
const B=[[0.4,40,760],[0.9,760,700],[1.3,40,900],[1.7,760,860],[2.0,40,1040],[2.3,760,1020],[2.6,40,620],[2.85,760,560],[3.1,40,1180],[3.35,760,1160],[3.6,40,480]];
document.getElementById('bals').innerHTML=B.map((b,i)=>`<div class="el bal" id="b${i}" style="left:${b[1]}px;top:${b[2]}px">quanto custa?</div>`).join('');
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
function vis(id,a,b,anim){const e=document.getElementById(id);if(t<a||t>=b){e.style.opacity=0;return;}
 const p=ease((t-a)/.25),q=ease((b-t)/.25);e.style.opacity=Math.min(p,q);
 e.style.transform=anim==='pop'?`scale(${.7+.3*p})`:anim==='up'?`translateY(${(1-p)*40}px)`:'none';}
let t=0;
window.render=function(tt){t=tt;
 vis('h1',-1,5,'none');
 B.forEach((b,i)=>vis('b'+i,b[0],4.6,'pop'));
 vis('cont',0.6,9,'pop'); const c=document.getElementById('cont'); c.textContent=t<1.6?'12':t<2.8?'27':'40';
 c.style.transform=`scale(${1+.08*Math.max(0,Math.sin(t*14))})`;
 vis('h2',5,9,'pop');
 vis('h3',9.1,14,'up'); vis('h4',9.8,14,'up'); vis('ia',10.6,14,'pop');
 vis('fim',14,99,'none');
 const w=document.getElementById('wm'); w.style.opacity=(t<14)?.45:0;
};
</script></body></html>
