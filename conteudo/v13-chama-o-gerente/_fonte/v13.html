<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="logo.js"></script>
<style>
body{width:1080px;height:1920px;position:relative;overflow:hidden;background:#06060B}
#stage{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,#191A2B,#0E0E16 70%)}
.wall{position:absolute;left:60px;right:60px;top:420px;height:760px;border-radius:40px;background:#13141F;border:3px solid #23253A}
.sign{position:absolute;left:50%;top:470px;transform:translateX(-50%);font-family:'Bebas Neue';font-size:96px;letter-spacing:8px;padding:6px 50px;border-radius:20px;border:4px solid #00D4AA;color:#fff;box-shadow:0 0 40px rgba(0,212,170,.35);white-space:nowrap}
.counter{position:absolute;left:30px;right:30px;top:1180px;height:330px;border-radius:30px 30px 0 0;background:linear-gradient(180deg,#2A2C40,#1A1B28);border-top:8px solid #3A3D55;z-index:5}
.counter:after{content:'';position:absolute;left:0;right:0;top:40px;height:4px;background:rgba(255,255,255,.05)}
.char{position:absolute;top:780px;width:300px;height:520px;margin-left:-150px;z-index:3}
.char .body{position:absolute;left:40px;right:40px;top:230px;height:320px;border-radius:110px 110px 30px 30px}
.char .head{position:absolute;left:75px;top:40px;width:150px;height:150px;border-radius:50%;background:#E9EAEE}
.char .eye{position:absolute;top:62px;width:16px;height:22px;border-radius:8px;background:#0E0E16}
.char .mouth{position:absolute;left:50px;top:105px;width:50px;height:6px;border-radius:6px;background:#0E0E16;transform-origin:center}
.char .arm{position:absolute;top:270px;width:44px;height:200px;border-radius:22px;transform-origin:22px 20px}
.char .name{position:absolute;left:0;right:0;top:-40px;text-align:center;font-family:'Bebas Neue';font-size:46px;letter-spacing:4px;color:#A9ADB3}
.char.fala .name{color:#fff}
#dono .body,#dono .arm{background:#00D4AA} #ger .body,#ger .arm{background:#7B68EE}
#ger .hair{position:absolute;left:62px;top:28px;width:176px;height:110px;border-radius:90px 90px 20px 20px;background:#3B2E7A}
#dono .cap{position:absolute;left:70px;top:30px;width:160px;height:60px;border-radius:80px 80px 10px 10px;background:#0A8C72}
#phone{position:absolute;top:1040px;width:150px;height:260px;margin-left:-75px;border-radius:26px;background:#0B0D12;border:5px solid #3A3D55;z-index:6}
#phone:before{content:'';position:absolute;inset:14px;border-radius:14px;background:linear-gradient(180deg,#123,#0B3A33)}
#badge{position:absolute;right:-34px;top:-34px;min-width:84px;height:84px;padding:0 10px;border-radius:42px;background:#E5484D;color:#fff;font-family:'Bebas Neue';font-size:56px;display:flex;align-items:center;justify-content:center;z-index:2}
#badge.ok{background:#00D4AA;color:#0E0E16}
.msg{position:absolute;padding:14px 22px;border-radius:22px;background:#1F2130;border:2px solid #34374D;font-size:30px;white-space:nowrap;z-index:7}
.msg.ok{background:#0B4A3D;border-color:#00D4AA}
.msg.red{background:#3A1A22;border-color:#E5484D}
.msg.ia{background:linear-gradient(90deg,#00D4AA,#7B68EE);color:#0E0E16;font-weight:700;border:none}
#ia{position:absolute;width:300px;height:300px;margin-left:-150px;z-index:8;display:none}
#top{position:absolute;left:60px;right:60px;top:160px;text-align:center;font-family:'Bebas Neue';font-size:92px;line-height:1;z-index:9}
#cap{position:absolute;left:50%;top:1580px;transform:translateX(-50%);width:980px;text-align:center;font-family:'Bebas Neue';font-size:80px;line-height:1.02;z-index:10}
#cap span{color:rgba(255,255,255,.4)} #cap span.on{color:#fff} #cap span.now{color:#00D4AA}
#fin{position:absolute;inset:0;z-index:20;background:radial-gradient(circle at 50% 40%,#16172A,#0E0E16 70%);display:none}
#fin .t{position:absolute;left:60px;right:60px;top:520px;text-align:center;font-family:'Bebas Neue';font-size:130px;line-height:1}
#brand{position:absolute;left:0;right:0;top:1060px;text-align:center}
#sym{width:220px;height:220px;margin:0 auto 26px} #brand .nm{font-size:42px;font-weight:600;letter-spacing:16px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:30}
.zz{position:absolute;font-family:'Bebas Neue';font-size:60px;color:#A9ADB3;z-index:9;display:none}
</style></head><body><div id="stage"><div class="tex"></div>
<div class="wall"></div><div class="sign">SUA EMPRESA</div>
<div class="char" id="dono" style="left:250px"><div class="name">DONO</div><div class="arm" id="da" style="left:200px"></div><div class="body"></div><div class="head"><div class="cap"></div><div class="eye" style="left:45px"></div><div class="eye" style="left:90px"></div><div class="mouth" id="dm"></div></div></div>
<div class="char" id="ger" style="left:830px"><div class="name">GERENTE</div><div class="arm" id="ga" style="left:56px"></div><div class="body"></div><div class="head"><div class="hair"></div><div class="eye" style="left:45px"></div><div class="eye" style="left:90px"></div><div class="mouth" id="gm"></div></div></div>
<div class="counter"></div>
<div id="phone"><div id="badge">0</div></div>
<div id="msgs"></div>
<div id="ia"></div>
<div class="zz" id="z1" style="left:120px;top:700px">AH...</div><div class="zz" id="z2" style="left:880px;top:700px">UFA</div>
<div id="top"></div><div id="cap"></div>
<div id="fin"><div class="tex"></div><div class="t">A IA ATENDE PRIMEIRO.<br><span class="grad">VOCÊ ENTRA NO QUE<br>PRECISA DE VOCÊ.</span></div><div id="brand"><div id="sym"></div><div class="nm">MALVORA</div></div></div>
<div id="flash"></div></div>
<script>
const F=__FALAS__;
const clamp=x=>Math.min(Math.max(x,0),1),ease=x=>1-Math.pow(1-clamp(x),3),back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},rnd=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const $=id=>document.getElementById(id);$('sym').innerHTML=logoSVG(4);$('ia').innerHTML=logoSVG(4);
const Q=["quanto custa?","tem horário hoje?","vocês entregam?","oi??","alguém aí?","aceita Pix?","abre sábado?","oi","qual o endereço?","tem desconto?"];
const M=Q.map((q,i)=>({q,a:0.6+i*1.3,x:70+rnd(i)*700,y:250+(i%4)*55+rnd(i+5)*20}));
$('msgs').innerHTML=M.map((m,i)=>`<div class="msg" id="q${i}" style="left:${m.x}px;top:${m.y}px">${m.q}</div>`).join('')+
 `<div class="msg red" id="red" style="left:300px;top:300px">o pedido veio errado 😕</div><div class="msg ia" id="iam" style="left:250px;top:380px">Vou chamar a Renata agora.</div><div class="msg ok" id="res" style="left:420px;top:1340px">Resolvido ✓</div>`;
const KP=[[0,360],[8.9,360],[9.25,720],[10.9,720],[11.25,360],[12.9,360],[13.3,540],[16.6,540],[17.0,540]];
const kp=t=>{for(let i=0;i<KP.length-1;i++){const[a,x]=KP[i],[b,y]=KP[i+1];if(t<b)return x+(y-x)*ease((t-a)/(b-a));}return 540};
const T={freeze:13.3,ia:15.6,grab:16.3,clear0:16.6,clear1:18.6,red:19.2,iam:19.8,go:20.3,res:21.3,fin:22.3};
window.render=function(t){
 let shake=0;
 // falas
 let fala=null;for(const f of F) if(t>=f.a&&t<f.a+f.d) fala=f;
 ['dono','ger'].forEach(q=>{const el=$(q),m=$(q==='dono'?'dm':'gm');const on=fala&&fala.q===q;el.classList.toggle('fala',!!on);
  let amp=0;if(on){const k=Math.floor((t-fala.a)*30);amp=Math.min(1,(fala.env[k]||0)*9);}
  m.style.transform=`scaleY(${1+amp*5}) scaleX(${1-amp*.3})`;m.style.height=6+'px';
  const bob=on?Math.sin(t*14)*4:0;el.style.transform=`translateY(${bob}px)`;});
 // braço empurrando o celular
 const px=kp(t);
 $('da').style.transform=`rotate(${-90+60*clamp(1-Math.abs(px-430)/160)}deg)`;$('ga').style.transform=`rotate(${90-60*clamp(1-Math.abs(px-650)/160)}deg)`;
 // celular
 let py=1040,ph=$('phone');
 const iaOn=t>=T.ia; if(t>=T.grab){const g=ease((t-T.grab)/0.4);py=1040-300*g;}
 ph.style.left=px+'px';ph.style.top=py+'px';
 const vib=t<T.freeze&&Math.floor(t*2)%3===0;ph.style.transform=`rotate(${vib?Math.sin(t*90)*6:0}deg)`;
 // contador
 let n=Math.min(47,Math.floor(t<T.freeze?12+t*2.6:47));
 if(t>=T.clear0){n=Math.round(47*(1-ease((t-T.clear0)/(T.clear1-T.clear0))));}
 $('badge').textContent=n;$('badge').className=n===0?'ok':'';
 if(t>=T.red&&t<T.res) {$('badge').textContent=1;$('badge').className='';}
 // mensagens soltas
 M.forEach((m,i)=>{const e=$('q'+i);const on=t>=m.a&&t<T.clear0+0.2*i+0.4;e.style.display=on?'':'none';
  if(on){const k=back((t-m.a)/0.3);e.style.transform=`scale(${k}) translateY(${Math.sin(t*2+i)*8}px)`;
   const ok=t>=T.clear0+0.2*i;e.className='msg'+(ok?' ok':'');if(ok){e.textContent=m.q+' ✓';e.style.opacity=1-clamp((t-T.clear0-0.2*i-0.2)/0.2);} else {e.textContent=m.q;e.style.opacity=1;}}});
 if(t<T.freeze&&M.some(m=>t>=m.a&&t-m.a<0.08)) shake=4;
 // IA
 const ia=$('ia');ia.style.display=iaOn?'block':'none';
 if(iaOn){const d=back((t-T.ia)/0.5);ia.style.left=px+'px';ia.style.top=(-300+(py-330+300)*d)+'px';ia.style.filter=`drop-shadow(0 0 ${30+20*Math.sin(t*6)}px rgba(0,212,170,.7))`;}
 // alívio
 const rel=ease((t-17.4)/0.5);['z1','z2'].forEach(z=>{$(z).style.display=t>=17.4&&t<T.red?'block':'none';$(z).style.opacity=rel;});
 $('dono').style.top=(780+40*rel*(t<T.red?1:0))+'px';
 $('ger').style.top=(780+40*rel*(t<T.go?1:0)-(t>=T.go?ease((t-T.go)/0.4)*40:0))+'px';
 if(t>=T.go){$('ger').style.left=(830-150*ease((t-T.go)/0.6))+'px';} else $('ger').style.left='830px';
 const sh=(id,a,b)=>{const e=$(id);const on=t>=a&&t<b;e.style.display=on?'':'none';if(on)e.style.transform=`scale(${back((t-a)/0.3)})`;};
 sh('red',T.red,T.fin);sh('iam',T.iam,T.fin);sh('res',T.res,T.fin);
 if(t>=T.red&&t-T.red<0.15) shake=8;
 // texto do topo
 let top='';if(t>=12.0&&t<T.ia) top='NINGUÉM QUER RESPONDER<br><span style="color:#E5484D">O "QUANTO CUSTA?" PELA 40ª VEZ.</span>';
 else if(t>=T.ia&&t<T.red) top='<span class="grad">A IA ATENDE PRIMEIRO.</span>';
 else if(t>=T.red&&t<T.fin) top='O QUE PRECISA DE GENTE<br><span class="grad">VAI PRA GENTE.</span>';
 $('top').innerHTML=top;
 // congela
 const fr=t>=T.freeze&&t<T.ia;$('stage').style.filter=fr?'saturate(.35) contrast(1.1)':'none';
 // legenda
 let cur=null,ws=[];F.forEach(f=>{for(let k=0;k<f.words.length;k+=4){const ch=f.words.slice(k,k+4);const a=ch[0].t,b=ch[ch.length-1].t+ch[ch.length-1].d+0.15;if(t>=a&&t<b)cur=ch;}});
 $('cap').innerHTML=cur?cur.map(w=>`<span class="${t>=w.t?'on':''}${t>=w.t&&t<w.t+w.d+.05?' now':''}">${w.w}</span>`).join(' '):'';
 // fim
 $('fin').style.display=t>=T.fin?'block':'none';if(t>=T.fin){$('fin').style.opacity=ease((t-T.fin)/0.4);$('brand').style.opacity=ease((t-T.fin-1)/0.5);}
 $('flash').style.opacity=Math.max(0,.4-Math.abs(t-T.freeze)*4,.35-Math.abs(t-T.ia)*4);
 $('stage').style.transform=shake?`translate(${(rnd(Math.floor(t*60))-.5)*shake*2}px,0)`:'none';
};
</script></body></html>
